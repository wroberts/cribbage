language: python
python:
  - "3.11"
  - "3.12"
  - "3.13"
  - "3.14"
  - "3.15"
before_install:
  - "pip install pytest-cov coveralls"
# command to install dependencies (also builds the C extension)
install: "pip install -e ."
# command to run tests
script: py.test --cov=cribbage cribbage
after_success: coveralls
